worker_processes 1;
pid /run/kvmd/nginx.pid;
error_log stderr;
events { worker_connections 256; }
http {
    include /etc/kvmd/nginx/mime.types;
    default_type application/octet-stream;
    access_log syslog:server=unix:/dev/log,tag=vim4_pikvm;
    client_body_temp_path /run/kvmd/nginx-body;
    proxy_temp_path /run/kvmd/nginx-proxy;
    fastcgi_temp_path /run/kvmd/nginx-fastcgi;
    uwsgi_temp_path /run/kvmd/nginx-uwsgi;
    scgi_temp_path /run/kvmd/nginx-scgi;
    proxy_http_version 1.1;
    include /etc/kvmd/nginx/kvmd.ctx-http.conf;
    server {
        listen 8080;
        include /etc/kvmd/nginx/kvmd.ctx-server.conf;
    }
}
